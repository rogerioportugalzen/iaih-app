name: Importar mídia do ElevenLabs
on:
  push:
    branches: [midia]
    paths: ['midia/pedido.sh']
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Baixar e tratar
        run: bash midia/pedido.sh
      - name: Guardar no repositório
        run: |
          git config user.name "iahii-bot"
          git config user.email "bot@users.noreply.github.com"
          git add midia/
          git commit -m "Mídia importada" || echo "nada novo"
          git push

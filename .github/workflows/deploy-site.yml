name: Publicar a landing page em iaih.app

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar a pasta site/ para a raiz do domínio (nunca toca na pasta app/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_ROOT_USERNAME }}
          password: ${{ secrets.FTP_ROOT_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./
          state-name: .landing-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            app/**
